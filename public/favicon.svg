<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0a0a0b"/>
  <!-- Document body -->
  <rect x="7" y="5" width="13" height="17" rx="2" fill="#e8975a" opacity="0.15" stroke="#e8975a" stroke-width="1.5"/>
  <!-- Document lines -->
  <line x1="10" y1="10" x2="17" y2="10" stroke="#e8975a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="13" x2="17" y2="13" stroke="#e8975a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="14" y2="16" stroke="#e8975a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Magnifying glass circle -->
  <circle cx="21" cy="21" r="5" fill="#0a0a0b" stroke="#e8975a" stroke-width="1.8"/>
  <!-- Magnifying glass handle -->
  <line x1="25" y1="25" x2="28" y2="28" stroke="#e8975a" stroke-width="2" stroke-linecap="round"/>
</svg>
